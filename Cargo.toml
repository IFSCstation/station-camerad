[package]
name = "station-camerad"
version = "0.1.0"
edition = "2021"
description = "Webcam owner daemon: publishes RGB8 frames to the cam_ring (RGB24 passthrough or YUYV conversion)"
license = "MIT"

[lib]
name = "camerad"
path = "src/lib.rs"

[[bin]]
name = "camerad"
path = "src/bin/camerad.rs"

[dependencies]
libc = "0.2"